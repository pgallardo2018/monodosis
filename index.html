        <title>PRONTO - CafeLabs</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <style>
            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                overflow: hidden;
                background-color: #121212;
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            }

            #canvas-container {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
            }

            #coming-soon-text {
                position: absolute;
                bottom: 10%;
                left: 50%;
                transform: translateX(-50%);
                text-align: center;
                color: #ffffff;
                font-size: clamp(1.5rem, 4vw, 4rem);
                font-weight: bold;
                letter-spacing: 0.3em;
                white-space: nowrap;
                text-shadow:
                    0 0 12px rgba(255, 210, 120, 0.5),
                    0 0 40px rgba(255, 180, 60, 0.2);
                opacity: 0;
                animation:
                    fadeIn 2s ease-in-out 1s forwards,
                    pulse 4s ease-in-out infinite 3s;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateX(-50%) translateY(12px);
                }
                to {
                    opacity: 1;
                    transform: translateX(-50%) translateY(0);
                }
            }

            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                    transform: translateX(-50%) scale(1);
                }
                50% {
                    opacity: 0.8;
                    transform: translateX(-50%) scale(1.04);
                }
            }
        </style>
    </head>

            const planeGeo = new THREE.PlaneGeometry(16, 9);
            const planeMat = new THREE.MeshBasicMaterial({
                map: moleculeTexture,
                transparent: true,
                alphaTest: 0.01, // descarta píxeles casi transparentes
                side: THREE.DoubleSide,
                depthWrite: false,
            });

            const imagePlane = new THREE.Mesh(planeGeo, planeMat);
            imagePlane.position.y = 1.5;
            scene.add(imagePlane);

            // ── Textura de grano de café (dibujada en canvas 2D) ──────────────────────
            function createBeanTexture() {
                const S = 128;
                const cv = document.createElement("canvas");
                cv.width = S;
                cv.height = S;
                const ctx = cv.getContext("2d");
                const cx = S / 2,
                    cy = S / 2;
                const rx = S * 0.3,
                    ry = S * 0.44;

                // Cuerpo con degradado radial (iluminación lateral)
                const grad = ctx.createRadialGradient(
                    cx - rx * 0.35,
                    cy - ry * 0.25,
                    2,
                    cx,
                    cy,
                    ry,
                );
                grad.addColorStop(0.0, "#9b5e1a"); // reflejo cálido
                grad.addColorStop(0.35, "#6b3a0e"); // marrón medio
                grad.addColorStop(0.75, "#3d1f06"); // borde oscuro
                grad.addColorStop(1.0, "#1a0b02"); // sombra borde

                ctx.save();
                ctx.beginPath();
                ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.restore();

                // Surco central curvo
                ctx.save();
                ctx.strokeStyle = "#1a0b02";
                ctx.lineWidth = S * 0.04;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(cx, cy - ry * 0.72);
                ctx.bezierCurveTo(
                    cx + rx * 0.38,
                    cy - ry * 0.2,
                    cx + rx * 0.38,
                    cy + ry * 0.2,
                    cx,
                    cy + ry * 0.72,
                );
                ctx.stroke();
                ctx.restore();

                // Reflejo especular
                const shine = ctx.createRadialGradient(
                    cx - rx * 0.3,
                    cy - ry * 0.35,
                    1,
                    cx - rx * 0.3,
                    cy - ry * 0.35,
                    rx * 0.55,
                );
                shine.addColorStop(0, "rgba(255,200,120,0.22)");
                shine.addColorStop(1, "rgba(255,200,120,0)");
                ctx.save();
                ctx.beginPath();
                ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
                ctx.clip();
                ctx.fillStyle = shine;
                ctx.fillRect(0, 0, S, S);
                ctx.restore();

                return new THREE.CanvasTexture(cv);
            }

            // ── Granos de café con InstancedMesh ──────────────────────────────────────
            const BEAN_COUNT = 80;
            const beanTexture = createBeanTexture();

            const beanGeo = new THREE.PlaneGeometry(0.55, 0.82);
            const beanMat = new THREE.MeshBasicMaterial({
                map: beanTexture,
                transparent: true,
                alphaTest: 0.05,
                side: THREE.DoubleSide,
                depthWrite: false,
            });

            const beans = new THREE.InstancedMesh(beanGeo, beanMat, BEAN_COUNT);
            beans.frustumCulled = false;
            scene.add(beans);

            const dummy = new THREE.Object3D();
            const beanData = Array.from({ length: BEAN_COUNT }, () => ({
                x: (Math.random() - 0.5) * 48,
                y: (Math.random() - 0.5) * 34,
                z: (Math.random() - 0.5) * 20 - 4,
                speed: Math.random() * 0.35 + 0.06,
                rx: Math.random() * Math.PI * 2,
                ry: Math.random() * Math.PI * 2,
                rz: Math.random() * Math.PI * 2,
                drx: (Math.random() - 0.5) * 0.018,
                dry: (Math.random() - 0.5) * 0.022,
                drz: (Math.random() - 0.5) * 0.01,
                scale: Math.random() * 0.55 + 0.35,
                sway: Math.random() * Math.PI * 2,
            }));

            // ── Loop de animación ─────────────────────────────────────────────────────
            function animate() {
                requestAnimationFrame(animate);

                const elapsed = clock.getElapsedTime(); // segundos reales, frame-rate independent

                // Flotación orgánica de la molécula con frecuencias compuestas
                imagePlane.position.y =
                    1.5 +
                    Math.sin(elapsed * 0.8) * 0.38 +
                    Math.sin(elapsed * 1.7) * 0.08;

                // Rotación 3D sutil
                imagePlane.rotation.y = Math.sin(elapsed * 0.5) * 0.13;
                imagePlane.rotation.z = Math.sin(elapsed * 0.38) * 0.04;

                // Granos de café: flotan hacia arriba girando
                for (let i = 0; i < BEAN_COUNT; i++) {
                    const b = beanData[i];
                    b.y += b.speed * 0.012;
                    b.x += Math.sin(elapsed * 0.3 + b.sway) * 0.003;
                    b.rx += b.drx;
                    b.ry += b.dry;
                    b.rz += b.drz;
                    if (b.y > 17.5) b.y = -17.5;

                    dummy.position.set(b.x, b.y, b.z);
                    dummy.rotation.set(b.rx, b.ry, b.rz);
                    dummy.scale.setScalar(b.scale);
                    dummy.updateMatrix();
                    beans.setMatrixAt(i, dummy.matrix);
                }
                beans.instanceMatrix.needsUpdate = true;

                renderer.render(scene, camera);
            }

            animate();

            // ── Redimensionamiento ────────────────────────────────────────────────────
            window.addEventListener("resize", () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            });
